<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مختبر القطع الجبرية: النشر بالمساحات (الثالثة متوسط)</title>
<meta name="description" content="اسحب قطع x² و x و 1 لتملأ مستطيلا، ثم اكتب نشر الجداء وبسّطه.">
<style>
:root{--b1:#0b4f8a;--b2:#0e8f8a;--y:#f5c518;--ok:#1e8e3e;--ko:#c62828;--ink:#1d2433;--mut:#5b6474;--bg:#eef3f8;--card:#fff;--line:#d7dee8;--soft:#f6f9fc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:19px;line-height:1.75}
header.top{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;padding:14px 16px 12px;border-bottom:5px solid var(--y)}
header .school{font-size:13px;opacity:.92}
header h1{margin:6px 0 2px;font-size:25px;line-height:1.4}
header .badge{display:inline-block;background:var(--y);color:#3a2c00;border-radius:16px;padding:1px 12px;font-size:15px;font-weight:700;margin-bottom:4px}
header .sub{font-size:14px;opacity:.95}
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.bar .pill{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:2px 12px;font-weight:700;white-space:nowrap}
.bar .prog{flex:1;height:10px;background:#e3e9f1;border-radius:6px;overflow:hidden;min-width:60px}
.bar .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b2),var(--b1));transition:width .4s}
.bar button{border:1px solid var(--line);background:#fff;border-radius:10px;font-size:18px;padding:2px 8px;cursor:pointer}
main{max-width:820px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--b2);border-radius:16px;padding:16px 18px;margin:16px 0;box-shadow:0 4px 14px rgba(11,79,138,.07)}
.card>h2{margin:0 0 8px;font-size:21px;color:var(--b1);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 .tag{font-size:15px;background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center}
.card>h2 .pts{margin-inline-start:auto;font-size:14px;background:var(--y);color:#3a2c00;border-radius:12px;padding:1px 10px}
.card.done{border-top-color:var(--ok)}
.intro{color:var(--mut);margin:0 0 6px}
.how{background:#f1fbfa;border:1px dashed var(--b2);border-radius:12px;padding:8px 12px;font-size:16px;margin:8px 0}
.book{background:#fffbea;border:1px solid #f0dc8c}
.book .src{font-size:13px;color:#7a6200;margin-top:6px}
.rule{background:#fff;border-inline-start:4px solid var(--y);padding:6px 10px;margin:8px 0;border-radius:6px}
.qt{font-weight:600;margin-bottom:6px}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap;font-family:"Cambria Math","Times New Roman",serif;font-size:1.08em}
.mb{direction:ltr;unicode-bidi:isolate;display:block;white-space:nowrap;overflow-x:auto;text-align:center;font-family:"Cambria Math","Times New Roman",serif;font-size:1.12em;margin:4px 0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.15}
.fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.stage{display:block;width:100%;max-width:470px;height:auto;margin:8px auto;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none;direction:ltr}
.stage text{font-family:"Times New Roman",serif;pointer-events:none}
.dg{cursor:grab;outline:none}
.dg.on{cursor:grabbing}
.dg .hit{fill:transparent}
.dg:focus-visible .ring{stroke:#f5c518;stroke-width:4}
.ring{fill:#fff;stroke:var(--b1);stroke-width:2.5}
.dg.on .ring{fill:#fff6d0}
.live{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:16px;margin:4px 0;direction:rtl}
.live .v{direction:ltr;unicode-bidi:isolate;font-family:"Cambria Math","Times New Roman",serif;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:0 8px;white-space:nowrap}
.live .v.ok{border-color:var(--ok);background:#e8f6ec}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.tbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;font-size:17px;cursor:pointer;font-family:inherit;min-height:44px}
.tbtn:active{transform:scale(.97)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;text-align:start;font-size:18px;cursor:pointer;font-family:inherit;color:inherit;box-shadow:0 2px 0 #dfe6ef}
.opt.sel{border-color:var(--b1);background:#eaf3fd}
.opt.good{border-color:var(--ok);background:#e8f6ec}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ans{width:120px;font-size:22px;padding:6px 10px;border:2px solid var(--line);border-radius:10px;direction:ltr;text-align:center;font-family:"Cambria Math","Times New Roman",serif}
.ans:focus{outline:none;border-color:var(--b1)}
.btn{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;border:0;border-radius:14px;padding:11px 26px;font-size:19px;box-shadow:0 3px 0 #083a66;font-weight:700;cursor:pointer;font-family:inherit;min-height:48px}
.btn.sec{background:#fff;color:var(--b1);border:2px solid var(--b1);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.tries{font-size:14px;color:var(--mut);margin-inline-start:auto}
.fb{margin-top:8px;border-radius:10px;padding:8px 12px;display:none}
.fb.show{display:block}
.fb.hint{background:#fff6e0;border:1px solid #f2d68a}
.fb.okm{background:#e8f6ec;border:1px solid #9fd5ad}
.fb.kom{background:#fdecec;border:1px solid #efb1b1}
.model{margin-top:10px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:none}
.model.show{display:block}
.model h4{margin:0 0 4px;color:var(--b1);font-size:16px}
.model p{margin:2px 0}
table.sc{width:100%;border-collapse:collapse;margin-top:8px;font-size:16px}
table.sc td,table.sc th{border:1px solid var(--line);padding:4px 8px}
table.sc th{background:#e4effa}
table.sc td:last-child{text-align:center;width:70px;font-weight:700}
.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.toast{position:fixed;top:64px;right:12px;z-index:50;background:#fff;border:2px solid var(--ok);border-radius:12px;padding:8px 14px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.15);opacity:0;transform:translateY(-8px);transition:all .3s;max-width:80vw;pointer-events:none}
.toast.on{opacity:1;transform:none}
.toast.ko{border-color:#e0a100}
.fly{position:fixed;z-index:60;pointer-events:none;font-size:22px;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.6);opacity:0}}
#final{display:none;text-align:center;border-top-color:var(--y)}
#final.show{display:block}
#final .big{font-size:34px;font-weight:800;color:var(--b1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer{text-align:center;color:var(--mut);font-size:13px;padding:10px}
@media (max-width:420px){header h1{font-size:22px}.card{padding:14px 12px}body{font-size:18px}}

</style>
</head>
<body>
<header class="top">
  <div class="school">متوسطة محمد العربي بن مهيدي، وادي فراغة، قالمة — الأستاذ: يوسفي السوفي</div>
  <div class="badge">✋ مختبر الهندسة بالسحب</div>
  <h1 id="ttl"></h1>
  <div class="sub" id="sub"></div>
</header>
<div class="bar">
  <span class="pill" id="score">0 / 20</span>
  <span class="pill" id="stars">⭐ 0</span>
  <div class="prog" role="progressbar" aria-label="التقدّم"><i id="prog"></i></div>
  <button type="button" id="snd">🔊</button>
</div>
<main id="app"></main>
<footer>مختبر الهندسة بالسحب — رياضيات المتوسط</footer>
<div class="toast" id="toast" role="status"></div>
<script>
/* «مختبر السحب» shared engine (2026-11-18): geometry activities by DRAGGING points in inline SVG.
   No external library, works offline. Touch + mouse (pointer events) + keyboard (arrows) with ARIA labels.
   Missions: wrong 1 → hint 1, wrong 2 → hint 2 (often a visual help), wrong 3 → 0 + correct figure + model answer + scoring table.
   Stars 3/2/1 by try, full mark if right within the 3 tries. Progress on this phone only (localStorage). */
(function () {
  var S = window.SAHB = {};
  var NS = "http://www.w3.org/2000/svg";
  function $(s, r) { return (r || document).querySelector(s); }
  S.$ = $;
  S.el = function (tag, at, parent) { var e = document.createElementNS(NS, tag); for (var k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; };
  S.h = function (tag, cls, html, parent) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
  S.svg = function (box, w, h, label) { var s = S.el("svg", { viewBox: "0 0 " + w + " " + h, "class": "stage", width: w, height: h }); if (label) s.setAttribute("aria-label", label); box.appendChild(s); return s; };
  /* decimal comma, d decimals at most */
  S.f = function (x, d) { var p = Math.pow(10, d == null ? 2 : d), v = Math.round(x * p) / p; return String(v).replace("-", "−").replace(".", ","); };
  S.M = function (s) { return '<span class="m">' + s + "</span>"; };
  S.F = function (a, b) { return '<span class="fr"><span>' + a + "</span><span>" + b + "</span></span>"; };
  S.ptr = function (svg, e) { var p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };

  S.handle = function (svg, x, y, label, col) {
    var g = S.el("g", { "class": "dg" }, svg);
    S.el("circle", { "class": "hit", r: 22, cx: 0, cy: 0 }, g);
    S.el("circle", { "class": "ring", r: 8, cx: 0, cy: 0, style: col ? "stroke:" + col : "" }, g);
    S.el("circle", { r: 3, cx: 0, cy: 0, fill: col || "#0b4f8a" }, g);
    g.setAttribute("transform", "translate(" + x + " " + y + ")");
    g.setAttribute("aria-label", label || "");

  };
  S.place = function (g, x, y) { g.setAttribute("transform", "translate(" + x + " " + y + ")"); };

  S.drag = function (svg, el, o) {
    el.setAttribute("tabindex", "0"); el.setAttribute("role", "slider"); el.classList.add("dg");
    if (o.label) el.setAttribute("aria-label", o.label);

    function txt() { if (o.text) el.setAttribute("aria-valuetext", o.text()); }
    el.addEventListener("pointerdown", function (e) {
      if (o.disabled && o.disabled()) return;
      e.preventDefault(); on = true;
      try { el.setPointerCapture(e.pointerId); } catch (er) {}

      var p = S.ptr(svg, e), c = (!o.raw && o.get) ? o.get() : p;
      off = { x: c.x - p.x, y: c.y - p.y };
    });
    el.addEventListener("pointermove", function (e) { if (!on) return; var p = S.ptr(svg, e); o.move(p.x + off.x, p.y + off.y); });
    function end() { if (!on) return; on = false; el.classList.remove("on"); if (o.end) o.end(); txt(); }
    el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end); el.addEventListener("lostpointercapture", end);

      if (o.disabled && o.disabled()) return;
      var k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (!k) return;
      e.preventDefault();
      if (o.key) o.key(k[0], k[1]); else { var c = o.get(); o.move(c.x + k[0] * (o.step || 10), c.y + k[1] * (o.step || 10)); }

  };


  /* Latin maths inside Arabic text (book quotes, tables): wrap each run in an LTR box so «[A'B']» or «AB = A'B'» never get mirrored */
  var RUN = /[A-Za-z(\[][A-Za-z0-9'’()\[\]=+−×÷\/,.°<>≠≤≥ ]*[A-Za-z0-9'’)\]°]|[A-Za-z]/g;

    var list = [], t; while ((t = tw.nextNode())) if (/[A-Za-z]/.test(t.data)) list.push(t);
    list.forEach(function (t) {
      var s = t.data, last = 0, out = document.createDocumentFragment(), m, hit = false; RUN.lastIndex = 0;
      while ((m = RUN.exec(s))) { if (!/[A-Za-z]/.test(m[0])) continue; hit = true; out.appendChild(document.createTextNode(s.slice(last, m.index))); var sp = document.createElement("span"); sp.className = "m"; sp.textContent = m[0].trim(); out.appendChild(sp); if (/ $/.test(m[0])) out.appendChild(document.createTextNode(" ")); last = m.index + m[0].length; }
      if (!hit) return; out.appendChild(document.createTextNode(s.slice(last))); t.parentNode.replaceChild(out, t);
    });
  }
  S.bidi = bidi;
  if (window.MutationObserver) new MutationObserver(function (ms) { ms.forEach(function (m) { for (var i = 0; i < m.addedNodes.length; i++) { var n = m.addedNodes[i]; bidi(n.nodeType === 3 ? n.parentElement : n); } }); }).observe(document.documentElement, { childList: true, subtree: true });

  /* ---------- sound, stars, toast ---------- */
  var mute = false, actx = null;
  try { mute = localStorage.getItem("sahb-mute") === "1"; } catch (e) {}
  function beep(ok) {
    if (mute) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain(); o.connect(g); g.connect(actx.destination);
      o.type = "sine"; var t = actx.currentTime;
      if (ok) { o.frequency.setValueAtTime(660, t); o.frequency.setValueAtTime(880, t + 0.12); } else o.frequency.setValueAtTime(220, t);

  }
  S.beep = beep;
  function toast(t, ko) { var d = $("#toast"); if (!d) return; d.textContent = t; d.className = "toast on" + (ko ? " ko" : ""); clearTimeout(d._t); d._t = setTimeout(function () { d.className = "toast" + (ko ? " ko" : ""); }, 2600); }
  S.toast = toast;
  function fly(at, n, set) {
    var r = at.getBoundingClientRect();
    for (var i = 0; i < n; i++) {
      var s = document.createElement("span"); s.className = "fly"; s.textContent = set[i % set.length];
      s.style.left = (r.left + r.width / 2) + "px"; s.style.top = (r.top + 10) + "px";
      s.style.setProperty("--dx", (Math.random() * 220 - 110) + "px"); s.style.setProperty("--dy", (-60 - Math.random() * 120) + "px");
      document.body.appendChild(s); setTimeout(function (x) { return function () { x.remove(); }; }(s), 1200);
    }
  }
  var PRAISE = ["أحسنت! عمل دقيق 👏", "ممتاز! يدك ثابتة وعينك دقيقة ✨", "رائع! هكذا يعمل المهندس 📐", "برافو! تركيزك أثمر 🌟", "جميل جدا! واصل بنفس الهدوء 👍"];
  var ENC = ["ركّز جيدا وخذ وقتك، اقرأ التلميح 💡", "لا تستعجل: السرعة والتركيز لا يجتمعان 🙂", "خطوة خطوة، أنت قريب من الصواب 💪", "الخطأ جزء من التعلّم، حاول مرة أخرى ✨"];
  function pick(a, i) { return a[i % a.length]; }

  /* ---------- the lab ---------- */
  S.run = function (cfg) {
    var KEY = "sahb_" + cfg.key, st = {};
    try { st = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { st = {}; }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
    var app = $("#app"), TOTAL = 0;
    cfg.missions.forEach(function (m) { TOTAL += m.pts; });
    document.title = cfg.docTitle;
    $("#ttl").textContent = cfg.title; $("#sub").textContent = cfg.sub;
    var snd = $("#snd"); snd.textContent = mute ? "🔇" : "🔊";
    snd.setAttribute("aria-label", "الصوت");
    snd.onclick = function () { mute = !mute; snd.textContent = mute ? "🔇" : "🔊"; try { localStorage.setItem("sahb-mute", mute ? "1" : ""); } catch (e) {} };

    if (cfg.intro) { var ic = S.h("section", "card", "<h2>✋ كيف أعمل؟</h2>" + cfg.intro, app); }
    if (cfg.book) S.h("section", "card book", "<h2>📘 من الكتاب المدرسي</h2>" + cfg.book, app);

    var cards = [];
    cfg.missions.forEach(function (m, i) {
      var c = S.h("section", "card", "", app); c.id = "m-" + m.id;
      S.h("h2", "", '<span class="tag">' + (i + 1) + "</span>" + m.title + '<span class="pts">' + m.pts + " ن</span>", c);
      S.h("div", "qt", m.text, c);
      var box = S.h("div", "", "", c);
      var s = st[m.id] || (st[m.id] = { t: 0 });
      var locked = function () { return !!s.done; };
      var api = m.build(box, { locked: locked, M: S.M, F: S.F });
      var row = S.h("div", "row", "", c);
      var chk = S.h("button", "btn", "تحقّق ✔", row); chk.type = "button";
      var tr = S.h("span", "tries", "", row);
      var fb = S.h("div", "fb", "", c); fb.setAttribute("aria-live", "polite");

      function model() {
        var mo = m.model, h = "<h4>📗 الإجابة النموذجية</h4>";
        h += "<p><b>الطريقة:</b> " + mo.m + "</p>";
        (mo.s || []).forEach(function (x) { h += "<p>" + x + "</p>"; });
        h += "<p><b>الاستنتاج:</b> " + mo.c + "</p>";
        var sc = m.scale || [[m.title, m.pts]];
        h += '<table class="sc"><tr><th>سلم التنقيط</th><th>العلامة</th></tr>';
        sc.forEach(function (r) { h += "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>"; });
        md.innerHTML = h + "</table>"; md.classList.add("show");
      }
      function finish(ok, restore) {
        chk.disabled = true; c.classList.add("done");
        if (api.lock) api.lock();
        if ((!ok || restore) && api.solve) api.solve();
        if (ok && api.success) api.success();
        model(); showTries();
        if (!restore) { upd(); if (ok) { beep(true); fly(chk, 4 + (s.stars || 0) * 2, ["⭐", "🌟", "✨"]); } }
        if (restore) { fb.className = "fb show " + (ok ? "okm" : "kom"); fb.innerHTML = ok ? "✅ أنجزت هذه المهمة." : "📌 راجع الإجابة النموذجية."; }
      }
      chk.onclick = function () {
        if (s.done) return;
        var r = api.check();
        if (r === null) return;
        var ok = r === true;
        if (ok) {
          s.done = 1; s.stars = 3 - s.t; s.pts = m.pts; save();
          fb.className = "fb show okm"; fb.innerHTML = "✅ " + pick(PRAISE, i + s.t) + (m.okMsg ? "<br>" + m.okMsg : "");
          toast(pick(PRAISE, i + s.t));
          finish(true);
          return;
        }
        s.t++; save();
        c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); beep(false);
        if (s.t >= 3) {
          s.done = 1; s.stars = 0; s.pts = 0; save();
          fb.className = "fb show kom"; fb.innerHTML = "لا بأس، فكلّ خطأ درسٌ يقرّبك من النجاح. انظر الشكل الصحيح والإجابة النموذجية 👇";
          toast("لا بأس، فكلّ خطأ درسٌ يقرّبك من النجاح", true);
          finish(false);
          return;
        }
        var msg = (typeof r === "string" && r) ? r + "<br>" : "";
        var hint = s.t === 1 ? m.h1 : m.h2;
        if (api.hint) api.hint(s.t);
        fb.className = "fb show hint"; fb.innerHTML = msg + "💡 <b>تلميح " + s.t + ":</b> " + hint;
        toast(pick(ENC, i + s.t), true); fly(chk, s.t === 1 ? 3 : 5, ["⭐", "💡", "✨"]);
        showTries();
      };
      showTries();
      if (s.done) finish(s.pts > 0, true);
      cards.push(c);
    });

    var fin = S.h("section", "card", "", app); fin.id = "final";
    window.totalQuestionsCount = cfg.missions.length;
    function upd() {
      var sc = 0, stars = 0, dn = 0;
      cfg.missions.forEach(function (m) { var s = st[m.id]; if (s && s.done) { dn++; sc += s.pts || 0; stars += s.stars || 0; } });
      window.totalScore = sc; window.totalStars = stars; window.completedQuestions = dn;
      $("#score").textContent = sc + " / " + TOTAL; $("#stars").textContent = "⭐ " + stars;
      $("#prog").style.width = Math.round(dn / cfg.missions.length * 100) + "%";
      if (dn === cfg.missions.length) {
        var msg = sc >= 17 ? "🏅 مهندس متمكّن! عمل دقيق ومتقن." : sc >= 12 ? "👍 عمل جيد، أعد المهام التي أخطأت فيها لتتقنها." : "💪 بداية طيبة. اقرأ الإجابات النموذجية ثم أعد المختبر.";
        fin.innerHTML = "<h2>🏁 نتيجتك في المختبر</h2><div class='big'>" + sc + " / " + TOTAL + "</div><p>⭐ " + stars + "</p><p>" + msg + "</p>" + (cfg.next ? "<p>" + cfg.next + "</p>" : "") +
          "<button type='button' class='btn sec' id='again'>🔁 أعد المختبر من البداية</button>";
        fin.classList.add("show");
        $("#again").onclick = function () { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); };
      }
    }
    upd();
    bidi(app);
  };
})();

<script>
/* 3AM S5 (term 2): algebra tiles, the pupil drags x², x and 1 tiles to fill a rectangle and reads the expansion.
   Book 3AM «الحساب الحرفي», «معارف» p.58: a(b + c) = ab + ac ; (a + b)(c + d) = ac + ad + bc + bd. */
(function () {
  var S = SAHB, M = S.M, X = 78, O = 26;
  var COL = { xx: "#93c5fd", x1: "#86efac", "1x": "#86efac", "11": "#fde68a" };
  var NAME = { xx: "x²", x1: "x", "1x": "x", "11": "1" };
  /* polynomial typed by the pupil → [c0, c1, c2], "dup" when a power appears twice (not simplified), null when unreadable */
  function poly(s) {
    s = String(s).replace(/[٠-٩]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩".indexOf(d); }).replace(/\s+/g, "").replace(/[−–]/g, "-").replace(/²/g, "^2").replace(/,/g, ".").replace(/[×*·]/g, "").replace(/X/g, "x");
    if (!s) return null;
    var c = [0, 0, 0], seen = {}, first = true;
    while (s.length) {
      var m = /^([+-])?(\d+(?:\.\d+)?)?(x(\^2)?)?/.exec(s);
      if (!m || !m[0] || (!m[2] && !m[3]) || (!first && !m[1])) return null;
      var deg = m[3] ? (m[4] ? 2 : 1) : 0;
      if (seen[deg]) return "dup";
      seen[deg] = 1;
      c[deg] += (m[2] ? +m[2] : 1) * (m[1] === "-" ? -1 : 1);
      s = s.slice(m[0].length); first = false;
    }
    return c;
  }
  function fmtP(c) {
    var t = [];
    [[c[2], "x²"], [c[1], "x"], [c[0], ""]].forEach(function (p) { if (!p[0]) return; t.push((t.length ? " + " : "") + (p[0] === 1 && p[1] ? "" : p[0]) + p[1]); });
    return t.join("");
  }
  function lbl(dims) { var nx = dims.filter(function (d) { return d === "x"; }).length, n1 = dims.length - nx; return [nx ? (nx > 1 ? nx : "") + "x" : "", n1 ? String(n1) : ""].filter(Boolean).join(" + "); }
  function keys(box, inp, api) {
    var k = S.h("div", "tools", "", box);
    ["x", "²", "+", "−", "⌫"].forEach(function (s) {
      var b = S.h("button", "tbtn", s, k); b.type = "button"; b.style.minWidth = "52px"; b.style.fontFamily = "Cambria Math,Times New Roman,serif";
      b.onclick = function () { if (api.locked()) return; inp.value = s === "⌫" ? inp.value.slice(0, -1) : inp.value + s; inp.focus(); };
    });
  }
  function exprIn(box, api, label) {
    var r = S.h("div", "row", "", box); S.h("span", "", label, r);
    var inp = S.h("input", "ans", null, r); inp.style.width = "220px"; inp.setAttribute("aria-label", "النشر"); inp.setAttribute("autocomplete", "off");
    keys(box, inp, api);
    return inp;
  }
  function checkExpr(inp, want) {
    var p = poly(inp.value);
    if (!String(inp.value).trim()) { S.toast("اكتب النشر أولا ✍️", true); return null; }
    if (p === "dup") return "النشر صحيح ربما، لكن العبارة ليست مبسّطة: اجمع الحدود المتشابهة (مثل " + M("3x + 2x") + ").";
    if (!p) return "لم أفهم الكتابة: اكتب مثلا " + M("x² + 5x + 6") + ".";
    if (p[0] === want[0] && p[1] === want[1] && p[2] === want[2]) return true;
    if (p[2] === want[2] && p[0] === want[0] && p[1] !== want[1]) return "الحدّان " + M(want[2] === 1 ? "x²" : want[2] + "x²") + " و " + M(String(want[0])) + " صحيحان 👍 راجع عدد قطع " + M("x") + ".";
    return "";
  }

  /* fill the rectangle (cols × rows) with tiles, then write the expansion */
  function tiles(o) {
    var want = [0, 0, 0];
    o.rows.forEach(function (r) { o.cols.forEach(function (c) { want[(r === "x" ? 1 : 0) + (c === "x" ? 1 : 0)]++; }); });
    var cells = [], inp, svg, sel = null, tray = [], left, top = 40;
    var expr = "(" + lbl(o.rows) + ")(" + lbl(o.cols) + ")";
    if (o.rows.every(function (r) { return r === "1"; })) expr = o.rows.length + "(" + lbl(o.cols) + ")";
    return {
      id: o.id, pts: o.pts, title: o.title,
      text: "املأ المستطيل الذي بعداه " + M(lbl(o.cols)) + " و " + M(lbl(o.rows)) + " بالقطع: <b>اسحب</b> قطعة من الأسفل إلى خانة تناسبها (أو اضغط القطعة ثم الخانة). ثم اكتب نشر " + M(expr) + ".",
      build: function (box, api) {
        var W = o.cols.reduce(function (s, c) { return s + (c === "x" ? X : O); }, 0), H = o.rows.reduce(function (s, r) { return s + (r === "x" ? X : O); }, 0);
        left = Math.round((360 - W) / 2) + 10;
        var trayY = top + H + 34, VH = trayY + X + 16;
        svg = S.svg(box, 360, VH, "مستطيل للملء بقطع جبرية");
        /* side labels */
        var cx = left;
        o.cols.forEach(function (c) { var w = c === "x" ? X : O, t = S.el("text", { x: cx + w / 2, y: top - 8, "font-size": 16, "text-anchor": "middle", "font-style": "italic" }, svg); t.textContent = c; cx += w; });
        var cy = top;
        o.rows.forEach(function (r) { var h = r === "x" ? X : O, t = S.el("text", { x: left - 12, y: cy + h / 2 + 6, "font-size": 16, "text-anchor": "middle", "font-style": "italic" }, svg); t.textContent = r; cy += h; });
        cy = top;
        o.rows.forEach(function (r) {
          var h = r === "x" ? X : O; cx = left;
          o.cols.forEach(function (c) {
            var w = c === "x" ? X : O, type = (c === "x" ? "x" : "1") + (r === "x" ? "x" : "1");
            if (type === "1x") type = "1x"; /* vertical x: width 1, height x */
            var g = S.el("g", { tabindex: 0, role: "button", "aria-label": "خانة بعداها " + c + " و " + r }, svg);
            var rc = S.el("rect", { x: cx, y: cy, width: w, height: h, fill: "#fff", stroke: "#94a3b8", "stroke-width": 1.2, "stroke-dasharray": "4 3" }, g);
            var tx = S.el("text", { x: cx + w / 2, y: cy + h / 2 + 5, "font-size": 15, "text-anchor": "middle", fill: "#1d2433" }, g);
            var cell = { x: cx, y: cy, w: w, h: h, type: type, full: false, rc: rc, tx: tx, g: g };
            cells.push(cell);
            g.addEventListener("click", function () { if (api.locked()) return; if (cell.full) { fill(cell, false); return; } if (sel) tryPut(sel, cell); });
            g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); g.dispatchEvent(new MouseEvent("click")); } });
            cx += w;
          });
          cy += h;
        });
        S.el("rect", { x: left, y: top, width: W, height: H, fill: "none", stroke: "#1d2433", "stroke-width": 2.4 }, svg);
        /* tray */
        var tl = S.el("text", { x: 350, y: trayY - 10, "font-size": 13, fill: "#5b6474", "text-anchor": "end" }, svg); tl.textContent = "القطع (لا تنفد):";
        var tx0 = 20;
        [["xx", X, X], ["x1", X, O], ["1x", O, X], ["11", O, O]].forEach(function (t) {
          var home = { x: tx0, y: trayY }, g = S.el("g", { "class": "dg" }, svg);
          S.el("rect", { x: 0, y: 0, width: t[1], height: t[2], rx: 3, fill: COL[t[0]], stroke: "#1d2433", "stroke-width": 1.4 }, g);
          var tt = S.el("text", { x: t[1] / 2, y: t[2] / 2 + 5, "font-size": 15, "text-anchor": "middle" }, g); tt.textContent = NAME[t[0]];
          var it = { type: t[0], g: g, home: home, pos: { x: home.x, y: home.y }, w: t[1], h: t[2], moved: false };
          g.setAttribute("transform", "translate(" + home.x + " " + home.y + ")");
          tray.push(it);
          S.drag(svg, g, { label: "قطعة " + NAME[t[0]] + " (" + (t[0] === "x1" ? "أفقية" : t[0] === "1x" ? "عمودية" : "") + ")", disabled: api.locked,
            get: function () { return it.pos; },
            move: function (x, y) { it.moved = true; it.pos = { x: x, y: y }; g.setAttribute("transform", "translate(" + x + " " + y + ")"); },
            key: function () {},
            end: function () {
              if (it.moved) {
                var c = it.pos.x + it.w / 2, d = it.pos.y + it.h / 2, hit = null;
                cells.forEach(function (cl) { if (c > cl.x && c < cl.x + cl.w && d > cl.y && d < cl.y + cl.h) hit = cl; });
                if (hit) tryPut(it, hit);
              }
              it.pos = { x: home.x, y: home.y }; g.setAttribute("transform", "translate(" + home.x + " " + home.y + ")");
              setTimeout(function () { it.moved = false; }, 50);
            } });
          g.addEventListener("click", function () { if (it.moved || api.locked()) return; select(it); });
          g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(it); } });
          tx0 += t[1] + 14;
        });
        function select(it) { sel = sel === it ? null : it; tray.forEach(function (t) { t.g.querySelector("rect").setAttribute("stroke-width", t === sel ? 4 : 1.4); t.g.querySelector("rect").setAttribute("stroke", t === sel ? "#c2410c" : "#1d2433"); }); }
        function fill(cl, on) { cl.full = on; cl.rc.setAttribute("fill", on ? COL[cl.type] : "#fff"); cl.rc.setAttribute("stroke-dasharray", on ? "" : "4 3"); cl.rc.setAttribute("stroke", on ? "#1d2433" : "#94a3b8"); cl.tx.textContent = on ? NAME[cl.type] : ""; count(); }
        function tryPut(it, cl) {
          if (cl.full) return;
          if (it.type !== cl.type) { S.toast("هذه القطعة لا تناسب هذه الخانة: انظر إلى بعدي الخانة 🔍", true); S.beep(false); return; }
          fill(cl, true); S.beep(true);
        }
        var cnt = S.h("div", "live", "", box);
        function count() {
          var n = { xx: 0, x: 0, "11": 0 }, full = 0;
          cells.forEach(function (c) { if (c.full) { full++; n[c.type === "xx" ? "xx" : c.type === "11" ? "11" : "x"]++; } });
          cnt.innerHTML = '<span class="v">x² : ' + n.xx + '</span><span class="v">x : ' + n.x + '</span><span class="v">1 : ' + n["11"] + '</span><span class="v' + (full === cells.length ? " ok" : "") + '">' + full + " / " + cells.length + "</span>";
        }
        count();
        inp = exprIn(box, api, M(expr + " ="));
        return {
          check: function () {
            var e = cells.filter(function (c) { return !c.full; }).length;
            if (e) { S.toast("أكمل ملء المستطيل أولا: بقيت " + e + " خانة", true); return null; }
            return checkExpr(inp, want);
          },
          lock: function () { inp.disabled = true; },
          solve: function () { cells.forEach(function (c) { if (!c.full) fill(c, true); }); inp.value = fmtP(want); }
        };
      },
      h1: "عدّ القطع في المستطيل: كل قطعة " + M("x²") + " تعطي حدّا " + M("x²") + "، وكل قطعة " + M("x") + " تعطي " + M("x") + "، وكل قطعة " + M("1") + " تعطي 1.",
      h2: "مساحة المستطيل = مجموع مساحات القطع. اكتب عدد كل نوع أمام رمزه، مثلا " + M("2x² + 3x + 1") + ".",
      model: {
        m: (o.rows.every(function (r) { return r === "1"; }) ? "خاصية التوزيع " + M("a(b + c) = ab + ac") : "الخاصية " + M("(a + b)(c + d) = ac + ad + bc + bd")) + "، وهي مساحة المستطيل مقسّمة إلى قطع.",
        s: o.steps,
        c: M(expr + " = " + fmtP(want))
      },
      scale: [["ملء المستطيل بالقطع المناسبة", 2], ["كتابة النشر مبسّطا", o.pts - 2]]
    };
  }

  var typed = {
    id: "t4", pts: 4, title: "أنشر دون قطع",
    text: "انشر ثم بسّط العبارة " + M("(x + 4)(x + 2)") + ". (تخيّل القطع في ذهنك أو ارسمها في كراسك.)",
    build: function (box, api) {
      var inp = exprIn(box, api, M("(x + 4)(x + 2) ="));
      return { check: function () { return checkExpr(inp, [8, 6, 1]); }, lock: function () { inp.disabled = true; }, solve: function () { inp.value = "x² + 6x + 8"; } };
    },
    h1: "اضرب كل حد من القوس الأول في كل حد من القوس الثاني: 4 جداءات.",
    h2: M("x × x + x × 2 + 4 × x + 4 × 2") + "، ثم اجمع الحدود المتشابهة.",
    model: {
      m: "الخاصية " + M("(a + b)(c + d) = ac + ad + bc + bd") + "، ثم نبسّط.",
      s: ['<span class="mb">(x + 4)(x + 2)</span>', '<span class="mb">= x × x + x × 2 + 4 × x + 4 × 2</span>', '<span class="mb">= x² + 2x + 4x + 8</span>', '<span class="mb">= x² + 6x + 8</span>'],
      c: M("(x + 4)(x + 2) = x² + 6x + 8")
    },
    scale: [["الجداءات الأربعة", 2], ["التبسيط", 2]]
  };
  var mc = (function () {
    var sel = -1, bt = [];
    return {
      id: "t5", pts: 4, title: "أختار النشر الصحيح",
      text: "ما هو نشر العبارة " + M("(2x + 1)(x + 3)") + " وتبسيطها؟ ✍️ أنجز الحساب في كراسك، ثم اختر.",
      build: function (box, api) {
        var op = S.h("div", "opts", "", box);
        [M("2x² + 3"), M("2x² + 7x + 3"), M("2x² + 6x + 3"), M("3x + 4")].forEach(function (t, i) { var b = S.h("button", "opt", (i + 1) + " " + t, op); b.type = "button"; bt.push(b); b.onclick = function () { if (api.locked()) return; sel = i; bt.forEach(function (x, j) { x.classList.toggle("sel", j === i); }); }; });
        return {
          check: function () { if (sel < 0) { S.toast("اختر إجابة أولا", true); return null; } if (sel === 1) return true; if (sel === 0) return "نسيت الجداءين الأوسطين " + M("2x × 3") + " و " + M("1 × x") + "."; if (sel === 2) return "نسيت الجداء " + M("1 × x") + "."; return "هذا مجموع وليس جداء."; },
          solve: function () { bt.forEach(function (x, j) { x.classList.toggle("good", j === 1); x.classList.remove("sel"); }); },
          success: function () { bt[1].classList.add("good"); }
        };
      },
      h1: "يجب أن تحصل على 4 جداءات قبل التبسيط.",
      h2: M("2x × x + 2x × 3 + 1 × x + 1 × 3") + ".",
      model: { m: "نطبّق " + M("(a + b)(c + d) = ac + ad + bc + bd") + ".", s: ['<span class="mb">(2x + 1)(x + 3)</span>', '<span class="mb">= 2x² + 6x + x + 3</span>', '<span class="mb">= 2x² + 7x + 3</span>'], c: "الجواب 2: " + M("2x² + 7x + 3") },
      scale: [["الجداءات الأربعة", 2], ["الاختيار الصحيح", 2]]
    };
  })();

  S.run({
    key: "3m_m5_qita3_v1",
    docTitle: "مختبر القطع الجبرية: النشر بالمساحات (الثالثة متوسط)",
    title: "مختبر القطع الجبرية: النشر بالمساحات",
    sub: "السنة الثالثة متوسط · المقطع الخامس: الحساب الحرفي",
    intro: '<div class="how">✋ <b>اسحب القطع الملونة</b> من أسفل الشكل إلى خانات المستطيل: القطعة الزرقاء ' + M("x²") + ' (مربع ضلعه ' + M("x") + ')، الخضراء ' + M("x") + ' (بعداها ' + M("x") + ' و 1)، الصفراء 1. القطعة تُقبل فقط في خانة لها نفس البعدين.<br>👆 أو اضغط القطعة ثم اضغط الخانة. اضغط خانة مملوءة لإفراغها.</div>',
    book: '<div class="rule"><b>النشر</b>: «نشر عبارة جداء يعني كتابتها على شكل مجموع.»</div>' +
      '<div class="rule"><b>خاصية 1</b> (التوزيعية): ' + M("a(b + c) = ab + ac") + '.<br><b>خاصية 2</b>: ' + M("(a + b)(c + d) = ac + ad + bc + bd") + '.</div>' +
      '<div class="rule"><b>التبسيط</b>: «تبسيط عبارة حرفية يعني كتابتها بأقل ما يمكن من الحدود في حالة مجموع».</div>' +
      '<div class="src">المصدر: الكتاب المدرسي للسنة الثالثة متوسط، باب «الحساب الحرفي»، «معارف» ص 58. القطع الجبرية وسيلة لرؤية النشر كمساحة مستطيل.</div>',
    missions: [
      tiles({ id: "t1", pts: 4, title: "خاصية التوزيع بالقطع", rows: ["1", "1", "1"], cols: ["x", "1", "1"],
        steps: ['<span class="mb">3(x + 2)</span>', '<span class="mb">= 3 × x + 3 × 2</span>', '<span class="mb">= 3x + 6</span>', "بالقطع: 3 قطع " + M("x") + " و 6 قطع 1."] }),
      tiles({ id: "t2", pts: 4, title: "نشر جداء قوسين", rows: ["x", "1", "1"], cols: ["x", "1", "1", "1"],
        steps: ['<span class="mb">(x + 2)(x + 3)</span>', '<span class="mb">= x × x + x × 3 + 2 × x + 2 × 3</span>', '<span class="mb">= x² + 3x + 2x + 6</span>', '<span class="mb">= x² + 5x + 6</span>', "بالقطع: قطعة " + M("x²") + " و 5 قطع " + M("x") + " و 6 قطع 1."] }),
      tiles({ id: "t3", pts: 4, title: "نشر مع 2x", rows: ["x", "1"], cols: ["x", "x", "1", "1", "1"],
        steps: ['<span class="mb">(x + 1)(2x + 3)</span>', '<span class="mb">= x × 2x + x × 3 + 1 × 2x + 1 × 3</span>', '<span class="mb">= 2x² + 3x + 2x + 3</span>', '<span class="mb">= 2x² + 5x + 3</span>', "بالقطع: قطعتا " + M("x²") + " و 5 قطع " + M("x") + " و 3 قطع 1."] }),
      typed, mc
    ],
    next: "القطع تصلح للأعداد الموجبة؛ وفي الكتاب أمثلة بأعداد سالبة تُنشر بنفس الخاصية."
  });
})();
