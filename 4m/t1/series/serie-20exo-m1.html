            margin-top: 6px;
            color: #ffffff;

=\"math\">B = √2 + 1</span>"}, "13-1": {"sol": "<b>الطريقة:</b> خوارزمية إقليدس: نقسم العدد الأكبر على الأصغر، ثم القاسم على الباقي، حتى نحصل على باق معدوم. PGCD هو آخر باق غير معدوم. ثم خاصية: بقسمة البسط والمقام على قاسمهما المشترك الأكبر نحصل على كسر غير قابل للاختزال.<br>نطبق خوارزمية إقليدس:<br><span class=\"math\">756 = 216 × 3 + 108</span><br><span class=\"math\">216 = 108 × 2 + 0</span><br>إذن <span class=\"math\">PGCD(756 ; 216) = 108</span>.<br><span class=\"math\">756 ÷ 108 = 7</span> و <span class=\"math\">216 ÷ 108 = 2</span><br><b>النتيجة:</b> <span class=\"math\">756/216 = (756 ÷ 108)/(216 ÷ 108) = 7/2</span><br><b>الاستنتاج:</b> <span class=\"math\"><span class=\"fr\"><span>756</span><span>216</span></span> = <span class=\"fr\"><span>756 ÷ 108</span><span>216 ÷ 108</span></span> = <span class=\"fr\"><span>7</span><span>2</span></span></span>.", "scale": ["PGCD = 108|1,5", "الكسر 7/2|1"], "sol0": "نطبق خوارزمية إقليدس:<br><span class=\"math\">756 = 216 × 3 + 108</span><br><span class=\"math\">216 = 108 × 2 + 0</span><br>إذن <span class=\"math\">PGCD(756 ; 216) = 108</span>.<br><span class=\"math\">756 ÷ 108 = 7</span> و <span class=\"math\">216 ÷ 108 = 2</span><br><b>النتيجة:</b> <span class=\"math\">756/216 = (756 ÷ 108)/(216 ÷ 108) = 7/2</span>"}, "13-2": {"sol": "<b>الطريقة:</b> خاصية: <span class=\"math\">√(a × b) = √a × √b</span>. نكتب العدد تحت الجذر على شكل جداء مربع تام في عدد آخر، ثم نجمع الحدود التي لها نفس الجذر.<br><span class=\"math\">√112 = √(16 × 7) = 4√7</span><br><span class=\"math\">√28 = √(4 × 7) = 2√7</span><br><span class=\"math\">E = 4√7 − 3 × 2√7 + 2√7</span><br><span class=\"math\">E = 4√7 − 6√7 + 2√7</span><br><span class=\"math\">E = (4 − 6 + 2)√7 = 0 × √7</span><br><b>النتيجة:</b> <span class=\"math\">E = 0</span><br><b>الاستنتاج:</b> <span class=\"math\">E = 0</span>.", "scale": ["تبسيط √112 و √28|1,5", "E = 0|1"], "sol0": "<span class=\"math\">√112 = √(16 × 7) = 4√7</span><br><span class=\"math\">√28 = √(4 × 7) = 2√7</span : ["المحيط 24√5 m|0,75", "عدد الأشجار 24|0,75"], "sol0": "• المحيط: <span class=\"math\">P = 2 × (8√5 + 4√5)</span><br><span class=\"math\">P = 2 × 12√5 = 24√5 m</span><br>• على محيط مغلق: عدد الأشجار = المحيط ÷ المسافة بين شجرتين:<br><span class=\"math\">24√5 ÷ √5 = 24</span><br><b>النتيجة:</b> 24 شجرة."}, "16-3": {"sol": "<b>الطريقة:</b> المساحة = الطول × العرض، مع <span class=\"math\">(√5)² = 5</span>. ثم مساحة الجزء الثاني = المساحة الكلية − مساحة القمح.<br>• المساحة الكلية: <span class=\"math\">S = 8√5 × 4√5</span><br><span class=\"math\">S = 32 × (√5)² = 32 × 5 = 160 m²</span><br>• نطرح مساحة القمح:<br><span class=\"math\">S2 = 160 − 60 = 100</span><br><b>النتيجة:</b> <span class=\"math\">S2 = 100 m²</span><br><b>الاستنتاج:</b> المساحة المتبقية 100 m².", "scale": ["المساحة الكلية 160 m²|0,75", "S2 = 100 m²|0,75"], "sol0": "• المساحة الكلية: <span class=\"math\">S = 8√5 × 4√5</span><br><span class=\"math\">S = 32 × (√5)² = 32 × 5 = 160 m²</span><br>• نطرح مساحة القمح:<br><span class=\"math\">S2 = 160 − 60 = 100</span><br><b>النتيجة:</b> <span class=\"math\">S2 = 100 m²</span>"}, "17-1": {"sol": "<b>الطريقة:</b> العدد المطلوب يقسم العددين معا وهو أكبر ما يمكن، إذن هو قاسمهما المشترك الأكبر، ونحسبه بخوارزمية إقليدس. ثم عدد البلاطات = (الطول ÷ الضلع) × (العرض ÷ الضلع).<br>• نحول إلى السنتيمتر: <span class=\"math\">756 cm</span> و <span class=\"math\">420 cm</span><br>• ضلع البلاطة = <span class=\"math\">PGCD(756 ; 420)</span>:<br><span class=\"math\">756 = 420 × 1 + 336</span><br><span class=\"math\">420 = 336 × 1 + 84</span><br><span class=\"math\">336 = 84 × 4 + 0</span><br>إذن الضلع <span class=\"math\">84 cm</span>.<br>• عدد البلاطات: <span class=\"math\">756 ÷ 84 = 9</span> و <span class=\"math\">420 ÷ 84 = 5</span><br><span class=\"math\">9 × 5 = 45</span><br><b>النتيجة:</b> الضلع 84 cm وعدد البلاطات 45.<br><b>الاستنتاج:</b> ضلع البلاطة 84 cm وعدد البلاطات 45.", "scale": ["PGCD(756 ; 420) = 84 cm|1,5", "عدد البلاطات 45|1"], "h1": "💡 تلميح 1: حوّل البعدين إلى السنتيمتر (<span class=\"math\">756 cm</span> و <span class=\"math\">420 cm</span>) ثم احسب <span class=\"math\">PGCD(756 ; 420)</span>.", "h2": "💡 تلميح 2: عدد البلاطات = (عدد البلاطات على الطول) × (عدد البلاطات على العرض)، واكتب: الضلع;العدد.", "sol0": "• نحول إلى السنتيمتر: <span class=\"math\">756 cm</span> و <span class=\"math\">420 cm</span><br>• ضلع البلاطة = <span class=\"math\">PGCD(756 ; 420)</span>:<br><span class=\"math\">756 = 420 × 1 + 336</span><br><span class=\"math\">420 = 336 × 1 + 84</span><br><span class=\"math\">336 = 84 × 4 + 0</span><br>إذن الضلع <span class=\"math\">84 cm</span>.<br>• عدد البلاطات: <span class=\"math\">756 ÷ 84 = 9</span> و <span class=\"math\">420 ÷ 84 = 5</span><br><span class=\"math\">9 × 5 = 45</span><br><b>النتيجة:</b> الضلع 84 cm وعدد البلاطات 45."}, "17-2": {"sol": "<b>الطريقة:</b> التكلفة = عدد البلاطات × ثمن البلاطة الواحدة.<br><span class=\"math\">45 × 350 = 15750</span><br><b>النتيجة:</b> <span class=\"math\">15750 DA</span><br><b>الاستنتاج:</b> تكلفة التبليط 15750 DA.", "scale": ["العملية 45 × 350|1", "15750 DA|1,5"], "sol0": "<span class=\"math\">45 × 350 = 15750</span><br><b>النتيجة:</b> <span class=\"math\">15750 DA</span>"}, "18-1": {"sol": "<b>الطريقة:</b> العدد المطلوب يقسم العددين معا وهو أكبر ما يمكن، إذن هو قاسمهما المشترك الأكبر، ونحسبه بخوارزمية إقليدس.<br>• المسافة تقسم الطول والعرض وهي أكبر ما يمكن، إذن هي <span class=\"math\">PGCD(476 ; 306)</span>:<br><span class=\"math\">476 = 306 × 1 + 170</span><br><span class=\"math\">306 = 170 × 1 + 136</span><br><span class=\"math\">170 = 136 × 1 + 34</span><br><span class=\"math\">136 = 34 × 4 + 0</span><br><b>النتيجة:</b> <span class=\"math\">34 m</span><br><b>الاستنتاج:</b> المسافة بين كل عمودين متتاليين 34 m.", "scale": ["تبرير استعمال PGCD|0,5", "الخوارزمية: 34 m|2"], "sol0": "• المسافة تقسم الطول والعرض وهي أكبر ما يمكن، إذن هي <span class=\"math\">PGCD(476 ; 306)</span>:<br><span class=\"math\">476 = 306 × 1 + 170</span><br><span class=\"math\">306 = 170 × 1 + 136</span><br><span class=\"math\">170 = 136 × 1 + 34</span><br><span class=\"math\">136 = 34 × 4 + 0</span><br><b>النتيجة:</b> <span class=\"math\">34 m</span>"}, "18-2": {"sol": "<b>الطريقة:</b> على محيط مغلق: عدد الأعمدة = المحيط ÷ المسافة. ثم الثمن = عدد الأعمدة × ثمن العمود.<br>• المحيط: <span class=\"math\">2 × (476 + 306) = 1564 m</span><br>• على محيط مغلق: <span class=\"math\">1564 ÷ 34 = 46</span> عمودا.<br>• الثمن: <span class=\"math\">46 × 850 = 39100 DA</span><br><b>النتيجة:</b> 46 عمودا بثمن <span class=\"math\">39100 DA</span><br><b>الاستنتاج:</b> نحتاج 46 عمودا بثمن 39100 DA.", "scale": ["عدد الأعمدة 46|1,5", "الثمن 39100 DA|1"], "partMsg": "⚠️ انتبه: على محيط مغلق، عدد الأعمدة = المحيط ÷ المسافة (دون إضافة عمود). اكتب: الأعمدة;الثمن.", "h2": "💡 تلميح 2: احسب <span class=\"math\">1564 ÷ 34</span>، ثم اضرب عدد الأعمدة في <span class=\"math\">850 DA</span>.", "sol0": "• المحيط: <span class=\"math\">2 × (476 + 306) = 1564 m</span><br>• على محيط مغلق: <span class=\"math\">1564 ÷ 34 = 46</span> عمودا.<br>• الثمن: <span class=\"math\">46 × 850 = 39100 DA</span><br><b>النتيجة:</b> 46 عمودا بثمن <span class=\"math\">39100 DA</span>"}, "19-1": {"sol": "<b>الطريقة:</b> مساحة المربع <span class=\"math\">x²</span>، فنحل المعادلة <span class=\"math\">x² = 162</span> ونأخذ الحل الموجب (الطول موجب)، ثم نبسّط الجذر.<br>• ضلع المربع x موجب و <span class=\"math\">x² = 162</span>، إذن <span class=\"math\">x = √162</span><br><span class=\"math\">162 = 81 × 2</span><br><span class=\"math\">√162 = √81 × √2 = 9√2</span><br><b>النتيجة:</b> <span class=\"math\">x = 9√2 m</span><br><b>الاستنتاج:</b> ضلع المربع <span class=\"math\">9√2</span> m.", "scale": ["x = √162|1", "التبسيط 9√2 m|1,5"], "h2": "💡 تلميح 2: فكك <span class=\"math\">162 = 81 × 2</span> ثم استعمل <span class=\"math\">√(a × b) = √a × √b</span>.", "sol0": "• ضلع المربع x موجب و <span class=\"math\">x² = 162</span>، إذن <span class=\"math\">x = √162</span><br><span class=\"math\">162 = 81 × 2</span><br><span class=\"math\">√162 = √81 × √2 = 9√2</span><br><b>النتيجة:</b> <span class=\"math\">x = 9√2 m</span>"}, "19-2": {"sol": "<b>الطريقة:</b> محيط المربع = 4 × الضلع، والتكلفة = المحيط × ثمن المتر. نستعمل قيمة مقربة <span class=\"math\">√2 ≈ 1,414</span> للمقارنة مع المبلغ المتوفر.<br>• المحيط: <span class=\"math\">4 × 9√2 = 36√2 m</span><br>• التكلفة: <span class=\"math\">36√2 × 200 = 7200√2 DA</span><br><span class=\"math\">7200√2 ≈ 7200 × 1,414</span><br><span class=\"math\">7200√2 ≈ 10180,8 DA</span><br>• المقارنة: <span class=\"math\">10180,8 > 10000</span><br><b>النتيجة:</b> التكلفة <span class=\"math\">10180,8 DA</span> والمبلغ لا يكفي.<br><b>الاستنتاج:</b> التكلفة حوالي 10180,8 DA، والمبلغ 10000 DA لا يكفي.", "scale": ["المحيط والتكلفة 7200√2|1", "القيمة 10180,8 DA|1", "القرار: لا يكفي|0,5"], "partMsg": "⚠️ أكمل الإجابة: التكلفة ثم الرمز ; ثم القرار (نعم أو لا).", "h2": "💡 تلميح 2: عوّض <span class=\"math\">√2</span> بـ <span class=\"math\">1,414</span> في <span class=\"math\">7200√2</span>، ثم قارن النتيجة بـ <span class=\"math\">10000 DA</span>.", "sol0": "• المحيط: <span class=\"math\">4 × 9√2 = 36√2 m</span><br>• التكلفة: <span class=\"math\">36√2 × 200 = 7200√2 DA</span><br><span class=\"math\">7200√2 ≈ 7200 × 1,414</span><br><span class=\"math\">7200√2 ≈ 10180,8 DA</span><br>• المقارنة: <span class=\"math\">10180,8 > 10000</span><br><b>النتيجة:</b> التكلفة <span class=\"math\">10180,8 DA</span> والمبلغ لا يكفي."}, "20-1": {"sol": "<b>الطريقة:</b> المساحة = الطول × العرض. نضرب الأعداد معا والجذور معا: <span class=\"math\">√a × √b = √(a × b)</span>.<br><span class=\"math\">S = L × l = 15√12 × 10√3</span><br><span class=\"math\">S = 150 × √(12 × 3)</span><br><span class=\"math\">S = 150 × √36</span><br><span class=\"math\">S = 150 × 6</span><br><b>النتيجة:</b> <span class=\"math\">S = 900 m²</span> وهو عدد طبيعي.<br><b>الاستنتاج:</b> المساحة 900 m²، وهي عدد طبيعي.", "scale": ["S = 150√36|1,5", "S = 900 m²|1"], "sol0": "<span class=\"math\">S = L × l = 15√12 × 10√3</span><br><span class=\"math\">S = 150 × √(12 × 3)</span><br><span class=\"math\">S = 150 × √36</span><br><span class=\"math\">S = 150 × 6</span><br><b>النتيجة:</b> <span class=\"math\">S = 900 m²</span> وهو عدد طبيعي."}, "20-2": {"sol": "<b>الطريقة:</b> الجزء المتبقي بعد التبرع = <span class=\"math\">1 − <span class=\"fr\"><span>1</span><span>6</span></span></span>، وحصة الابن «كسر من كسر» = جداء الكسرين، ثم نصيبه = الكسر × المبلغ الكلي.<br>• الكسر المتبقي بعد التبرع: <span class=\"math\">1 − 1/6 = 5/6</span><br>• حصة الابن من المبلغ الكلي:<br><span class=\"math\">(2/5) × (5/6) = 10/30 = (10 ÷ 10)/(30 ÷ 10) = 1/3</span><br>• نصيبه: <span class=\"math\">480000 × 1/3 = 160000</span><br><b>النتيجة:</b> الكسر <span class=\"math\">1/3</span> والنصيب <span class=\"math\">160000 DA</span><br><b>الاستنتاج:</b> حصة الابن <span class=\"math\"><span class=\"fr\"><span>1</span><span>3</span></span></span> من المبلغ، أي 160000 DA.", "scale": ["الكسر 5/6 ثم 1/3|1,5", "النصيب 160000 DA|1"], "partMsg": "⚠️ اختزل الكسر إلى أبسط شكل، واكتب الشطرين معا بالصيغة: الكسر;المبلغ.", "h2": "💡 تلميح 2: اختزل الجداء <span class=\"math\">(2/5) × (5/6)</span>، ثم احسب جداء 480000 في الكسر الذي وجدته.", "sol0": "• الكسر المتبقي بعد التبرع: <span class=\"math\">1 − 1/6 = 5/6</span><br>• حصة الابن من المبلغ الكلي:<br><span class=\"math\">(2/5) × (5/6) = 10/30 = (10 ÷ 10)/(30 ÷ 10) = 1/3</span><br>• نصيبه: <span class=\"math\">480000 × 1/3 = 160000</span><br><b>النتيجة:</b> الكسر <span class=\"math\">1/3</span> والنصيب <span class=\"math\">160000 DA</span>"}};
        const CATFIX = {"1": "تمرين تطبيقي - المقطع 01", "2": "تمرين تطبيقي - المقطع 01", "3": "تمرين تطبيقي - المقطع 01", "4": "تمرين تطبيقي - المقطع 01", "5": "تمرين تطبيقي - المقطع 01", "6": "تمرين تطبيقي - المقطع 01", "7": "تمرين تطبيقي - المقطع 01", "8": "تمرين على نمط شهادة التعليم المتوسط", "9": "شهادة التعليم المتوسط - دورة 2018 (التمرين الأول)", "10": "تمرين على نمط شهادة التعليم المتوسط", "11": "مستوحى من شهادة التعليم المتوسط 2021 (الأعداد معدلة)", "12": "شهادة التعليم المتوسط - دورة 2022 (التمرين الأول)", "13": "السؤال 1 من شهادة التعليم المتوسط 2023", "14": "الكتاب المدرسي ص 17 تمرين 46 (من شهادة التعليم المتوسط)"};
        const TITLEFIX = {"8": "التمرين 08: العمليات على الكسور والأعداد الناطقة", "9": "التمرين 09: الجذور التربيعية وتبسيطها (BEM 2018)", "10": "التمرين 10: الـ PGCD واختزال الكسور", "11": "التمرين 11: القاسم المشترك الأكبر واختزال الكسور", "13": "التمرين 13: الـ PGCD والجذور (BEM 2023 السؤال 1)"};
        exercisesData.forEach(ex => { if (CATFIX[ex.id]) ex.catName = CATFIX[ex.id]; if (TITLEFIX[ex.id]) ex.title = TITLEFIX[ex.id];
            ex.questions.forEach(q => { const f = FIX[q.qId]; if (!f) return;
                q.sol = f.sol + '<h4 style="margin-top:10px">سلم التنقيط</h4><table class="scale">' + f.scale.map(r => { const [t, n] = r.split("|"); return `<tr><td>${t.replace(/([0-9√][0-9√ ,;=×÷+\/()−-]*[0-9√)](?:\s?(?:DA|cm²|cm|m²|m))?)/g, '<bdi dir="ltr">$1</bdi>')}</td><td class="n">${n} ن</td></tr>`; }).join("") + "</table>";
                ["h1", "h2", "partMsg"].forEach(k => { if (f[k]) q[k] = f[k]; }); }); });

        let totalScore = 0;
        const earned = {};
        const attempts = {};

        function renderAll() {
            const container = document.getElementById('exercisesContainer');
            container.innerHTML = '';

            exercisesData.forEach(ex => {
                const card = document.createElement('div');
                card.className = `ex-card cat-${ex.cat}`;
                card.dataset.cat = ex.cat;

                let qHtml = '';
                ex.questions.forEach(q => {
                    attempts[q.qId] = 3;
                    earned[q.qId] = 0;

                    let inputHtml = '';
                    if (q.type === 'select') {
                        let opts = `<option value="">-- اختر الإجابة --</option>`;
                        q.options.forEach(o => { opts += `<option value="${o.v}">${o.t}</option>`; });
                        inputHtml = `<select id="in-${q.qId}">${opts}</select>`;
                    } else {
                        inputHtml = `<input type="text" id="in-${q.qId}" placeholder="اكتب إجابتك هنا">`;
                    }

                    let symBtns = '';
                    if (q.sym && q.sym.length > 0) {
                        q.sym.forEach(s => {
                            symBtns += `<button type="button" class="sym-btn" onclick="insertChar('in-${q.qId}', '${s}')">إدراج (${s})</button>`;
                        });
                    }

                    qHtml += `
                        <div class="q-block" id="block-${q.qId}">
                            <div class="q-title">
                                <span>${q.text}</span>
                                <span class="att-badge" id="att-${q.qId}">المحاولات: 3 | (${q.pts} ن)</span>
                            </div>
                            <div class="input-row">
                                ${inputHtml}
                                ${symBtns}
                                <button class="btn-verify" id="btn-${q.qId}" onclick="checkAnswer('${ex.id}', '${q.qId}')">تحقق من الإجابة</button>
                            </div>
                            <div class="fb-box" id="fb-${q.qId}"></div>
                            <div class="sol-box" id="sol-${q.qId}">
                                <h4>✔ الإجابة النموذجية:</h4>
                                <div>${q.sol}</div>
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="ex-card-header">
                        <h3>${ex.title}</h3>
                        <span class="cat-tag">${ex.catName}</span>
                    </div>
                    <div class="ex-context">${ex.context}</div>
                    ${qHtml}
                `;
                container.appendChild(card);
            });
        }

        function insertChar(inputId, ch) {
            const el = document.getElementById(inputId);
            if (!el || el.disabled) return;
            el.value += ch;
            el.focus();
        }

        function normalize(str) {
            if (!str) return '';
            const ar = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            let s = str.toString().trim();
            for (let i = 0; i < 10; i++) s = s.replace(new RegExp(ar[i], 'g'), i);
            s = s.replace(/\s+/g, '')
                 .replace(/،/g, ';')
                 .replace(/و/g, ';')
                 .replace(/جذر/g, '√')
                 .replace(/على/g, '/')
                 .replace(/[−–]/g, '-').replace(/(^|;)[a-zA-Z]=/g, '$1').replace(/[*x]/g, '×').replace(/m²|m2|cm²|cm2|cm|da|m$/gi, '');
            return s;
        }

        function updateGlobalScore(qId, newPts, lockQuestion) {
            const prev = earned[qId] || 0;
            if (newPts > prev) {
                totalScore += (newPts - prev);
                earned[qId] = newPts;
                document.getElementById('globalScore').innerText = `${String(Math.round(totalScore * 100) / 100).replace('.', ',')} / 100`;
            }
            if (lockQuestion) {
                document.getElementById(`block-${qId}`).classList.add('solved');
                document.getElementById(`btn-${qId}`).disabled = true;

        const FBMSG = {"ok": ["أحسنت! تركيزك أوصلك إلى الجواب الصحيح.", "ممتاز! أخذت وقتك وفكّرت جيدا، وهذه هي النتيجة.", "برافو! التأنّي في الحساب يصنع النجاح.", "رائع! جهدك يستحق هذه النجوم.", "إجابة صحيحة! واصل بنفس الهدوء والتركيز.", "أحسنت! من يقرأ السؤال جيدا يصل إلى الحل.", "عمل متقن! الدقة أهم من السرعة، وأنت أثبتّ ذلك.", "بارك الله فيك! تقدّم خطوة بخطوة كما فعلت الآن."], "w1": ["لا بأس، الخطأ جزء من التعلّم. أعد قراءة السؤال بهدوء.", "تمهّل قليلا: كلما أسرعت قلّ تركيزك. خذ وقتك.", "محاولة جيدة! راجع حسابك خطوة بخطوة.", "كل خطأ يعلّمنا شيئا جديدا. ركّز وحاول مرة أخرى.", "لا تستعجل. اقرأ المعطيات من جديد ثم فكّر.", "أنت قريب. أعطِ هذا السؤال الوقت الذي يحتاجه.", "الخطأ ليس فشلا بل خطوة نحو الفهم. حاول مجددا.", "هدّئ السرعة وزِد التركيز، وستجد الطريق."], "w2": ["محاولة أخيرة: اكتب الحساب على ورقة قبل أن تجيب.", "لا تيأس! التركيز يأتي مع الهدوء. اقرأ التلميح جيدا.", "السرعة والتركيز لا يجتمعان: تمهّل في هذه المحاولة الأخيرة.", "ابذل جهدا إضافيا صغيرا، فالحل قريب منك.", "راجع كل خطوة على حدة، ولا تتسرّع.", "كل العلماء أخطؤوا قبل أن ينجحوا. ركّز في هذه المحاولة."], "fail": ["لا تحزن، الخطأ جزء من التعلّم. اقرأ الإجابة النموذجية وسلم التنقيط بتمعّن.", "تعلّمنا شيئا جديدا اليوم! تأمّل خطوات الحل، وأعد التمرين غدا بهدوء.", "لا بأس، الفهم يحتاج وقتا وجهدا. راجع الحل خطوة بخطوة.", "المهم أن نفهم لماذا أخطأنا. اقرأ الحل، ثم حاول إعادته وحدك على ورقة.", "الصبر والتركيز مفتاحا النجاح. راجع الحل وستنجح في المرة القادمة."]};
        function fbPick(kind, qId) { const a = FBMSG[kind]; const p = String(qId).split('-'); let n = (+p[0]) * 3 + (+p[1] || 0) + kind.length;
            if (isNaN(n)) { n = kind.length; for (const c of String(qId)) n = (n * 7 + c.charCodeAt(0)) % 9973; } return a[n % a.length]; }
        function checkAnswer(exId, qId) {
            const ex = exercisesData.find(e => e.id == exId);
            const q = ex.questions.find(item => item.qId === qId);
            const rawVal = document.getElementById(`in-${qId}`).value;

        function handleAttemptFail(q, partialAwarded, customMsg) {

<!-- FX: نجوم ورسائل تحفيزية -->
<style>
.fx-star{position:fixed;z-index:50;font-size:1.6rem;pointer-events:none;animation:fxfly .9s ease-out forwards}
@keyframes fxfly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(200deg);opacity:0}}
.fx-shake{animation:fxshake .45s}
@keyframes fxshake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fx-pop{animation:fxpop .5s}
@keyframes fxpop{50%{transform:scale(1.04)}}
.fx-toast{position:fixed;left:50%;top:110px;transform:translateX(-50%);z-index:60;background:#fff;color:#172033;border-radius:30px;padding:10px 22px;font-weight:bold;box-shadow:0 6px 24px #0003;animation:fxtoast 2.2s forwards;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.fx-toast.good{border:3px solid #22c55e}.fx-toast.bad{border:3px solid #f59e0b}
@keyframes fxtoast{0%{opacity:0;top:60px}12%{opacity:1;top:110px}80%{opacity:1}100%{opacity:0}}
.fx-stars{font-size:1.15rem;letter-spacing:2px;margin-inline-start:6px}
.fx-total{background:#fbbf24;color:#172033;border-radius:22px;padding:3px 12px;font-weight:bold;white-space:nowrap}
.fx-sound{background:none;border:0;font-size:1.2rem;cursor:pointer;padding:0 4px}
.fx-over{position:fixed;inset:0;z-index:70;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px}
.fx-card{background:#fff;color:#172033;border-radius:18px;padding:24px 20px;max-width:380px;width:100%;text-align:center;animation:fxpop .6s}
.fx-card .big{font-size:2.6rem;margin:6px 0}
.fx-card button{margin-top:12px;border:0;border-radius:9px;padding:9px 20px;background:#1d4ed8;color:#fff;font:inherit;font-weight:bold;cursor:pointer}
</style>
<script>
const FX = (() => {
  const PRAISE = ["أحسنت! التركيز يصنع الفرق", "ممتاز! التأني أوصلك للحل", "رائع! جهدك أثمر", "عمل متقن! الدقة قبل السرعة", "بارك الله فيك! واصل بهدوء", "برافو! قرأت السؤال جيدا"];
  const RETRY = ["الخطأ جزء من التعلّم، حاول مجددا 🌱", "تمهّل: السرعة تُضعف التركيز", "خذ وقتك وأعد القراءة بهدوء", "ركّز في المعطيات، أنت قريب", "ابذل جهدا صغيرا آخر 💪", "راجع حسابك خطوة بخطوة"];
  const LOST = "لا تحزن 🌱 الخطأ جزء من التعلّم: اقرأ الإجابة النموذجية بتمعّن وأعد المحاولة غدا بهدوء";
  const pick = a => a[Math.floor(Math.random() * a.length)];
  let stars = 0, sound = true, finished = false, actx = null;
  try { sound = localStorage.getItem("fx-sound") !== "0"; } catch (e) {}

  function tone(freqs){
    if (!sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      freqs.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * .12;
        o.frequency.value = f; o.type = "sine"; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .25);
        o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + .26);
      });
    } catch (e) {}
  }
  function toast(text, cls){
    document.querySelectorAll(".fx-toast").forEach(e => e.remove());
    const t = document.createElement("div"); t.className = "fx-toast " + cls; t.textContent = text;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2300);
  }
  function burst(el, n){
    const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = Math.max(r.top, 0) + 30;
    for (let i = 0; i < n; i++){
      const s = document.createElement("span"); s.className = "fx-star"; s.textContent = i % 3 ? "⭐" : "✨";
      const a = Math.random() * 2 * Math.PI, d = 70 + Math.random() * 90;
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.setProperty("--dx", Math.cos(a) * d + "px"); s.style.setProperty("--dy", Math.sin(a) * d - 40 + "px");
      document.body.appendChild(s); setTimeout(() => s.remove(), 950);
    }
  }
  function again(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function bar(){
    const b = document.querySelector(".scorebar, .sticky-inner > div"); if (!b || document.getElementById("fxTotal")) return;
    const t = document.createElement("span"); t.id = "fxTotal"; t.className = "fx-total"; t.textContent = "⭐ 0";
    const m = document.createElement("button"); m.className = "fx-sound"; m.title = "الصوت"; m.textContent = sound ? "🔊" : "🔇";
    m.onclick = () => { sound = !sound; m.textContent = sound ? "🔊" : "🔇"; try { localStorage.setItem("fx-sound", sound ? "1" : "0"); } catch (e) {} };
    (b.querySelector(".score") || b.querySelector(".score-pill")).after(t, m);
  }
  function upd(){ const t = document.getElementById("fxTotal"); if (t) t.textContent = "⭐ " + stars; }
  return {
    /* tries = عدد الأخطاء قبل الجواب الصحيح: 0 → 3 نجوم، 1 → نجمتان، 2 → نجمة */
    good(el, tries, fb){
      const n = Math.max(3 - tries, 1); stars += n; upd(); bar();
      if (fb) fb.insertAdjacentHTML("beforeend", ' <span class="fx-stars">' + "⭐".repeat(n) + "</span>");
      burst(el, 6 + n * 3); again(el, "fx-pop"); toast(pick(PRAISE) + " " + "⭐".repeat(n), "good"); tone([523, 659, 784]);
    },
    bad(el, last){ again(el, "fx-shake"); toast(last ? LOST : pick(RETRY), "bad"); tone(last ? [330, 262] : [392, 330]); },
    final(score, max){
      if (finished) return; finished = true;
      const p = score / max, msg = p >= .9 ? "أداء ممتاز! أنت نجم القسم 🏆" : p >= .7 ? "عمل جيد جدا! واصل التقدم 👏" : p >= .5 ? "عمل مقبول، راجع الأخطاء وستتحسن 💪" : "لا تستسلم! أعد التمارين وستنجح 🌱";
      const o = document.createElement("div"); o.className = "fx-over";
      o.innerHTML = `<div class="fx-card"><div class="big">${p >= .5 ? "🎉" : "💪"}</div><h2 style="margin:0">${msg}</h2>
        <p>علامتك: <b>${String(Math.round(score * 100) / 100).replace(".", ",")} / ${max}</b><br>نجومك: <b>⭐ ${stars}</b></p><button>متابعة</button></div>`;
      o.querySelector("button").onclick = () => o.remove(); o.onclick = e => { if (e.target === o) o.remove(); };
      document.body.appendChild(o); if (p >= .5){ burst(o.querySelector(".fx-card"), 24); tone([523, 659, 784, 1047]); }
    },
    reset(){ stars = 0; finished = false; upd(); },
    bar
  };
})();
FX.bar();
</script>
