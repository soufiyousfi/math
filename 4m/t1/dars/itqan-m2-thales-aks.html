body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:19px;line-height:1.75}
header.top{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;padding:14px 16px 12px;border-bottom:5px solid var(--y)}
header .school{font-size:13px;opacity:.92}
header h1{margin:6px 0 2px;font-size:25px;line-height:1.4}
header .badge{display:inline-block;background:var(--y);color:#3a2c00;border-radius:16px;padding:1px 12px;font-size:15px;font-weight:700;margin-bottom:4px}
header .sub{font-size:14px;opacity:.95}
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.bar .pill{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:2px 12px;font-weight:700;white-space:nowrap}
.bar .prog{flex:1;height:10px;background:#e3e9f1;border-radius:6px;overflow:hidden;min-width:60px}
.bar .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b2),var(--b1));transition:width .4s}
.bar button{border:1px solid var(--line);background:#fff;border-radius:10px;font-size:18px;padding:2px 8px;cursor:pointer}
main{max-width:820px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--b2);border-radius:16px;padding:16px 18px;margin:16px 0;box-shadow:0 4px 14px rgba(11,79,138,.07)}

.card>h2 .pts{margin-inline-start:auto;font-size:14px;background:var(--y);color:#3a2c00;border-radius:12px;padding:1px 10px}
.intro{color:var(--mut);margin:0 0 6px}
.book{background:#fffbea;border:1px solid #f0dc8c}
.book .src{font-size:13px;color:#7a6200;margin-top:6px}
.rule{background:#fff;border-inline-start:4px solid var(--y);padding:6px 10px;margin:8px 0;border-radius:6px}
.q{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.q:first-of-type{border-top:0;margin-top:4px;padding-top:4px}
.qt{font-weight:600;margin-bottom:8px}
.qt .qp{font-size:12px;font-weight:700;color:var(--b1);background:#e4effa;border-radius:10px;padding:0 8px;margin-inline-start:6px}
.mt{font-family:inherit!important;font-size:1em!important}
.key{direction:ltr}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap;font-family:"Cambria Math","Times New Roman",serif;font-size:1.08em}
.mb{direction:ltr;unicode-bidi:isolate;display:block;text-align:center;font-family:"Cambria Math","Times New Roman",serif;font-size:1.12em;margin:4px 0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.15}
.fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.sq{white-space:nowrap}.sq>span{border-top:1.6px solid currentColor;padding:0 2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:10px}
.opts.col{display:flex;flex-direction:column}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 12px;text-align:center;font-size:19px;cursor:pointer;font-family:inherit;color:inherit;box-shadow:0 2px 0 #dfe6ef;transition:transform .12s,border-color .12s}
.opts.col .opt{text-align:start}
.opt:active{transform:scale(.97)}
.opt.sel{border-color:var(--b1);background:#eaf3fd}
.opt.good{border-color:var(--ok);background:#e8f6ec}
.lines .opt{font-size:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ans{flex:1;min-width:150px;max-width:280px;font-size:22px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;direction:ltr;text-align:center;font-family:"Cambria Math","Times New Roman",serif}
.ans:focus{outline:none;border-color:var(--b1)}
.unit{font-weight:700}
.keys{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.key{min-width:50px;height:50px;font-size:22px;border:1px solid var(--line);border-radius:10px;background:var(--soft);cursor:pointer;font-family:"Cambria Math","Times New Roman",serif;flex:0 0 auto}
.btn{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;border:0;border-radius:14px;padding:11px 26px;font-size:19px;box-shadow:0 3px 0 #083a66;font-weight:700;cursor:pointer;font-family:inherit}
.btn.sec{background:#fff;color:var(--b1);border:2px solid var(--b1);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.fb{margin-top:8px;border-radius:10px;padding:8px 12px;display:none}
.fb.show{display:block}
.fb.hint{background:#fff6e0;border:1px solid #f2d68a}
.fb.okm{background:#e8f6ec;border:1px solid #9fd5ad}
.fb.kom{background:#fdecec;border:1px solid #efb1b1}
.tries{font-size:13px;color:var(--mut);margin-inline-start:auto}
.model{margin-top:10px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:none}
.model.show{display:block}
.model h4{margin:0 0 4px;color:var(--b1);font-size:16px}
.model .st{direction:ltr;text-align:left;font-family:"Cambria Math","Times New Roman",serif;margin:2px 0;white-space:nowrap;overflow-x:auto}
.model .st.ar{direction:rtl;text-align:right;font-family:inherit;white-space:normal}
table.sc{width:100%;border-collapse:collapse;margin-top:8px;font-size:16px}
table.sc td,table.sc th{border:1px solid var(--line);padding:4px 8px}
table.sc th{background:#e4effa}
table.sc td:last-child{text-align:center;width:70px;font-weight:700}
.seq{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:22px;padding:8px 16px;font-size:20px;box-shadow:0 2px 0 #dfe6ef;cursor:pointer;font-family:"Cambria Math","Times New Roman",serif;direction:ltr}
.chip.used{opacity:.35}

.picked .lt{color:var(--mut)}

.bins .seg button.on{border-color:var(--b1);background:#eaf3fd;font-weight:700}
.done-tag{font-weight:700}
.shake{animation:shk .45s}

.toast{position:fixed;top:64px;right:12px;z-index:50;background:#fff;border:2px solid var(--ok);border-radius:12px;padding:8px 14px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.15);opacity:0;transform:translateY(-8px);transition:all .3s;max-width:80vw}
.toast.on{opacity:1;transform:none}
.toast.ko{border-color:#e0a100}
.fly{position:fixed;z-index:60;pointer-events:none;font-size:22px;animation:fly 1.1s ease-out forwards}

.twin>.twn{font-size:15px;color:var(--mut);margin-bottom:6px}

#cert{text-align:center}

.namebox{font-size:18px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;width:min(320px,100%);font-family:inherit}
.lock{color:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:10px}

<script>
(function(){
const L=LESSON, KEY='ilaj_'+L.key+'_v1', TRIES=3;
let st={}, mute=false;
try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){st={};}
try{mute=localStorage.getItem('ilaj_mute')==='1';}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const $=s=>document.querySelector(s);
const PRAISE=['أحسنت! عمل دقيق ومركّز.','ممتاز! التركيز يصنع النجاح.','رائع! الصبر والانتباه أوصلاك إلى الجواب.','جواب صحيح، واصل بنفس الهدوء.','عمل متقن! خطوة ثابتة نحو الإتقان.','بارك الله فيك! هكذا يكون التفكير السليم.'];
const KIND=['لا بأس، فكلّ خطأ درسٌ يقرّبك من النجاح. اقرأ الإشارة جيدا.','خذ وقتك، فالسرعة والتركيز لا يجتمعان. انظر إلى الإشارة.','التعلّم صبرٌ وجهد؛ راجع خطوتك بهدوء.','الخطأ جزء من التعلّم، والإشارة ستساعدك.'];
const pick=(a,i)=>a[Math.abs(i)%a.length];
let AC=null;
function beep(ok){if(mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);const t=AC.currentTime;if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.12);}else{o.frequency.setValueAtTime(260,t);}g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.36);}catch(e){}}
function toast(msg,ko){const t=$('#toast');t.textContent=msg;t.className='toast on'+(ko?' ko':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2600);}
function fly(el,n,set){const r=el.getBoundingClientRect();for(let i=0;i<n;i++){const s=document.createElement('div');s.className='fly';s.textContent=set[i%set.length];s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+10)+'px';s.style.setProperty('--dx',(Math.random()*160-80)+'px');s.style.setProperty('--dy',(-60-Math.random()*90)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1200);}}
/* ===== answer normalisation & evaluation ===== */
function norm(s){s=String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
 s=s.replace(/٫|\./g,',').replace(/[−–-]/g,'−').replace(/[*xX]/g,'×').replace(/÷/g,':').replace(/\s+/g,'');
 s=s.replace(/×√/g,'√'); if(s[0]==='+')s=s.slice(1); return s;}
function evalx(s){ // numeric value of a simple expression or NaN
 s=norm(s).replace(/,/g,'.').replace(/−/g,'-').replace(/×/g,'*').replace(/:/g,'/');
 let i=0;const peek=()=>s[i];
 function num(){let j=i;while(i<s.length&&/[0-9.]/.test(s[i]))i++;if(j===i)throw 0;return parseFloat(s.slice(j,i));}
 function atom(){let c=peek();if(c==='-'){i++;return -atom();}if(c==='+'){i++;return atom();}
  if(c==='√'){i++;return Math.sqrt(atom());}
  if(c==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return v;}
  let v=num(); if(peek()==='√'||peek()==='('){return v*atom();} return v;}
 function pw(){let v=atom();while(peek()==='²'){i++;v=v*v;}return v;}
 function term(){let v=pw();while(peek()==='*'||peek()==='/'){const o=s[i++];const w=pw();v=o==='*'?v*w:v/w;}return v;}
 function expr(){let v=term();while(peek()==='+'||peek()==='-'){const o=s[i++];const w=term();v=o==='+'?v+w:v-w;}return v;}
 try{const v=expr();if(i!==s.length)return NaN;return v;}catch(e){return NaN;}}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
function fracParts(s){const m=norm(s).match(/^(−?)(\d+)\/(\d+)$/);if(!m)return null;return {n:(m[1]?-1:1)*+m[2],d:+m[3]};}
/* returns {r:'ok'|'half'|'ko', msg} */
function judge(q,raw){const a=norm(raw);if(!a)return {r:'empty'};
 if(q.wrong){for(const k in q.wrong){if(norm(k)===a)return {r:'ko',msg:q.wrong[k]};}}
 if((q.ans||[]).map(norm).includes(a))return {r:'ok'};
 if(q.half&&q.half.map(norm).includes(a))return {r:'half',msg:q.halfMsg};
 if(q.frac){const t=evalx(q.ans[0]),p=fracParts(a),v=evalx(a);
  if(p&&Math.abs(p.n/p.d-t)<1e-9){return gcd(p.n,p.d)===1?{r:'ok'}:{r:'half',msg:q.halfMsg||'جوابك صحيح، لكن الكسر غير مختزل. اختزله إلى أبسط شكل.'};}
  if(!p&&/^−?\d+(,\d+)?$/.test(a)&&Math.abs(v-t)<1e-9)return {r:'ok'};}
 if(q.num){const v=evalx(a);if(/^−?\d+(,\d+)?$/.test(a)&&Math.abs(v-evalx(q.ans[0]))<1e-9)return {r:'ok'};}
 if(q.between){const v=evalx(a);if(/^−?\d+(,\d+)?$/.test(a)&&v>q.between[0]&&v<q.between[1])return {r:'ok'};}
 return {r:'ko'};}
/* ===== rendering ===== */
const ALLQ=[],TW=[];let TOTAL=0;
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;}
function modelHtml(q){const md=q.model||{};let h='<h4>الإجابة النموذجية</h4>';

 (md.s||[]).forEach(x=>{h+= (typeof x==='string')?'<div class="st">'+x+'</div>':'<div class="st ar">'+x.ar+'</div>';});
 if(md.c)h+='<div><b>الاستنتاج:</b> '+md.c+'</div>';
 h+='<table class="sc"><tr><th>سلم التنقيط</th><th>النقطة</th></tr>';(q.scale||[['الجواب الصحيح',q.pts]]).forEach(r=>{h+='<tr><td>'+r[0]+'</td><td>'+String(r[1]).replace('.',',')+'</td></tr>';});h+='</table>';return h;}
function render(){
 $('#ttl').innerHTML=L.title;$('#sub').innerHTML=L.sub;document.title=L.docTitle||document.title;
 const app=$('#app');
 L.sections.forEach((sec,si)=>{
  let pts=(sec.qs||[]).reduce((a,q)=>a+q.pts,0);
  const c=el('<section class="card'+(sec.kind==='book'?' book':'')+'"><h2>'+(sec.tag?'<span class="tag">'+sec.tag+'</span>':'')+sec.title+(pts?'<span class="pts">'+String(pts).replace('.',',')+' ن</span>':'')+'</h2></section>');
  if(sec.intro)c.appendChild(el('<p class="intro">'+sec.intro+'</p>'));
  if(sec.html)c.appendChild(el('<div>'+sec.html+'</div>'));
  (sec.qs||[]).forEach((q,qi)=>{q.sec=sec;ALLQ.push(q);TOTAL+=q.pts;c.appendChild(buildQ(q));});
  app.appendChild(c);
 });
 const ce=el('<section class="card" id="cert"><h2>شهادة الإنجاز</h2><p class="lock" id="certlock">تُفتح الشهادة بعد الإجابة عن كل الأسئلة.</p><div id="certbox" style="display:none"><input class="namebox" id="nm" placeholder="اكتب اسمك ولقبك"><div class="row" style="justify-content:center"><button class="btn" id="mk">إظهار الشهادة</button><button class="btn sec" id="dl" style="display:none">حفظ الشهادة</button></div><canvas id="cv" width="1000" height="680" style="display:none"></canvas></div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn sec" id="reset">إعادة الدرس من البداية</button></div></section>');
 app.appendChild(ce);
 $('#mk').onclick=drawCert;$('#reset').onclick=()=>{if(confirmReset()){st={};save();location.reload();}};
 $('#dl').onclick=()=>{const a=document.createElement('a');a.download='شهادة.png';a.href=$('#cv').toDataURL('image/png');a.click();};
 $('#snd').textContent=mute?'🔇':'🔊';$('#snd').onclick=()=>{mute=!mute;$('#snd').textContent=mute?'🔇':'🔊';try{localStorage.setItem('ilaj_mute',mute?'1':'0');}catch(e){}};
 ALLQ.forEach(q=>{const s=st[q.id];if(s&&s.done)finish(q,s.pts,s.stars,true);else if(s&&s.tries)q._ui.tries.textContent='المحاولة '+(s.tries+1)+' من '+TRIES;});
 upd();
}
let resetArmed=false;function confirmReset(){if(resetArmed)return true;resetArmed=true;$('#reset').textContent='اضغط مرة ثانية للتأكيد';setTimeout(()=>{resetArmed=false;$('#reset').textContent='إعادة الدرس من البداية';},3000);return false;}
function buildQ(q){
 const w=el('<div class="q" id="q_'+q.id+'"><div class="qt">'+q.text+(q.isTwin?'':'<span class="qp">'+String(q.pts).replace('.',',')+' ن</span>')+'</div></div>');
 const body=document.createElement('div');w.appendChild(body);const ui={w,body,sel:null};q._ui=ui;
 if(q.type==='mc'||q.type==='line'){
  const isLong=(q.opts||q.lines).some(t=>t.replace(/<[^>]+>/g,'').length>16);const o=el('<div class="opts'+(q.type==='line'?' lines col':(isLong?' col':''))+'"></div>');
  (q.opts||q.lines).forEach((t,i)=>{const b=el('<button class="opt">'+t+'</button>');b.onclick=()=>{if(ui.locked)return;o.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');ui.sel=i;};o.appendChild(b);});
  body.appendChild(o);ui.opts=o;
 } else if(q.type==='type'){
  const r=el('<div class="row"><input class="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+(q.ph||'جوابك هنا')+'">'+(q.unit?'<span class="unit">'+q.unit+'</span>':'')+'</div>');
  body.appendChild(r);ui.inp=r.querySelector('input');
  const ks=el('<div class="keys"></div>');(q.keys||['−',',','/','⌫']).forEach(k=>{const b=el('<button class="key" type="button">'+k+'</button>');b.onclick=()=>{if(ui.locked)return;const i=ui.inp;if(k==='⌫'){i.value=i.value.slice(0,-1);}else i.value+=k;i.focus();};ks.appendChild(b);});
  body.appendChild(ks);ui.inp.addEventListener('keydown',e=>{if(e.key==='Enter')check(q);});
 } else if(q.type==='order'){
  ui.seq=[];const p=el('<div class="picked"><span class="lt">اضغط على الأعداد بالترتيب…</span></div>');const s=el('<div class="seq"></div>');
  q.items.forEach((t,i)=>{const c=el('<button class="chip">'+t+'</button>');c.onclick=()=>{if(ui.locked||c.classList.contains('used'))return;c.classList.add('used');ui.seq.push(i);drawSeq();};s.appendChild(c);});
  function drawSeq(){p.innerHTML=ui.seq.length?ui.seq.map(i=>'<span>'+q.items[i]+'</span>').join('<span class="lt">'+(q.sep||'&lt;')+'</span>'):'<span class="lt">اضغط على الأعداد بالترتيب…</span>';}
  ui.drawSeq=drawSeq;body.appendChild(p);body.appendChild(s);
  const clr=el('<div class="row"><button class="btn sec" type="button">مسح الترتيب</button></div>');clr.querySelector('button').onclick=()=>{if(ui.locked)return;ui.seq=[];s.querySelectorAll('.chip').forEach(x=>x.classList.remove('used'));drawSeq();};body.appendChild(clr);
 } else if(q.type==='bins'){
  ui.pick={};const b=el('<div class="bins"></div>');
  q.items.forEach((it,i)=>{const r=el('<div class="it"><span>'+it.t+'</span><span class="seg"></span></div>');const sg=r.querySelector('.seg');
   q.bins.forEach((bn,j)=>{const x=el('<button type="button">'+bn+'</button>');x.onclick=()=>{if(ui.locked)return;ui.pick[i]=j;sg.querySelectorAll('button').forEach(y=>y.classList.remove('on'));x.classList.add('on');};sg.appendChild(x);});b.appendChild(r);});
  body.appendChild(b);
 }
 const ctl=el('<div class="row"><button class="btn">تحقّق</button><span class="tries">المحاولة 1 من '+TRIES+'</span></div>');
 ctl.querySelector('button').onclick=()=>check(q);ui.btn=ctl.querySelector('button');ui.tries=ctl.querySelector('.tries');body.appendChild(ctl);
 ui.fb=el('<div class="fb"></div>');w.appendChild(ui.fb);
 ui.dm=el('<div class="diagmsg"></div>');w.appendChild(ui.dm);
 ui.model=el('<div class="model"></div>');w.appendChild(ui.model);
 return w;
}
function current(q){const ui=q._ui;
 if(q.type==='mc'||q.type==='line'){if(ui.sel===null)return {r:'empty'};return {r:ui.sel===q.ok?'ok':'ko',msg:(q.wrong||{})[ui.sel]};}
 if(q.type==='type')return judge(q,ui.inp.value);
 if(q.type==='order'){if(ui.seq.length<q.items.length)return {r:'empty',msg:'رتّب كل الأعداد أوّلا.'};return {r:ui.seq.join()===q.answer.join()?'ok':'ko'};}
 if(q.type==='bins'){if(Object.keys(ui.pick).length<q.items.length)return {r:'empty',msg:'اختر جوابا لكل سطر.'};let bad=q.items.filter((it,i)=>ui.pick[i]!==it.b).length;return {r:bad?'ko':'ok',msg:bad?('عدد الأسطر الخاطئة: '+bad+'.'):''};}
}
function check(q){const ui=q._ui;if(ui.locked)return;const s=st[q.id]=st[q.id]||{tries:0,best:0};
 const res=current(q);
 if(res.r==='empty'){ui.fb.className='fb show hint';ui.fb.innerHTML=res.msg||'أجب أوّلا ثم اضغط «تحقّق».';return;}
 s.tries++;
 if(res.r==='ok'){const stars=Math.max(1,4-s.tries);beep(true);fly(ui.btn,6+stars*2,['⭐','✨','🌟']);toast(pick(PRAISE,s.tries+q.id.length));finish(q,q.pts,stars,false);return;}
 if(res.r==='half'){s.best=Math.max(s.best,q.halfPts||q.pts/2);}
 beep(false);ui.w.classList.remove('shake');void ui.w.offsetWidth;ui.w.classList.add('shake');
 if(s.tries>=TRIES){finish(q,s.best||0,0,false);return;}
 const h=s.tries===1?q.h1:q.h2;
 ui.fb.className='fb show hint';ui.fb.innerHTML=(res.msg?'<div>'+res.msg+'</div>':'')+'<div>💡 <b>إشارة '+s.tries+':</b> '+h+'</div>';
 fly(ui.btn,s.tries===1?3:4,['⭐','💡','✨']);toast(pick(KIND,s.tries+q.id.length),true);
 ui.tries.textContent='المحاولة '+(s.tries+1)+' من '+TRIES;save();
}
function finish(q,pts,stars,restore){const ui=q._ui,s=st[q.id]=st[q.id]||{tries:0};ui.locked=true;s.done=true;s.pts=pts;s.stars=stars;
 ui.btn.disabled=true;ui.w.querySelectorAll('.ans').forEach(x=>x.disabled=true);
 const full=pts>=q.pts;
 ui.fb.className='fb show '+(full?'okm':'kom');
 ui.fb.innerHTML=full?('✅ <b>جواب صحيح.</b> '+'⭐'.repeat(stars)+(q.isTwin?'':' — '+String(pts).replace('.',',')+' / '+String(q.pts).replace('.',',')))+(q.after?'<div>'+q.after+'</div>':''):
  ((pts>0&&!q.isTwin?'🟡 حصلت على '+String(pts).replace('.',',')+' من '+String(q.pts).replace('.',',')+' (خطوات صحيحة).':'لا بأس، فكلّ خطأ درسٌ يقرّبك من النجاح.')+' اقرأ الإجابة النموذجية بتمعّن.');
 ui.tries.textContent='';
 if(q.type==='mc'||q.type==='line')ui.opts.querySelectorAll('.opt')[q.ok].classList.add('good');
 if(!full||q.showModel){ui.model.innerHTML=modelHtml(q);ui.model.classList.add('show');}
 else{const b=el('<button class="btn sec" style="margin-top:8px">عرض الإجابة النموذجية</button>');b.onclick=()=>{ui.model.innerHTML=modelHtml(q);ui.model.classList.toggle('show');};ui.fb.appendChild(b);}
 if(q.isTwin){const ps=st[q.parent.id];if(full&&ps){ps.rec=Math.round((q.parent.pts-(ps.pts||0))/2*100)/100;}ui.fb.innerHTML+=full?'<div>🔁 أتقنتَ الفكرة! استرجعتَ نصف النقاط التي فاتتك في السؤال الأصلي.</div>':'<div>راجع الإجابة النموذجية للسؤالين، ثم اسأل أستاذك عن هذه الفكرة.</div>';}
 else if(!full&&q.twin)showTwin(q);
 if(q.diag){ui.dm.innerHTML=full&&(restore||s.tries===1)?q.diag.ok:q.diag.ko;}
 save();upd();
}
function showTwin(q){if(q._tw)return;const t=Object.assign({pts:q.pts,type:q.type,keys:q.keys,unit:q.unit,bins:q.bins,frac:q.frac,num:q.num,ph:q.ph,halfPts:q.halfPts,halfMsg:q.halfMsg,sep:q.sep,scale:q.scale},q.twin,{id:q.id+'_tw',isTwin:true,parent:q});q._tw=t;TW.push(t);
 const box=el('<div class="twin"><div class="twh">🔁 مثال مماثل: طبّق ما تعلّمته من الإجابة النموذجية</div><div class="twn">اقرأ الإجابة النموذجية أعلاه، ثم أجب عن هذا المثال. إن أجبت صحيحا تسترجع نصف النقاط التي فاتتك.</div></div>');
 box.appendChild(buildQ(t));q._ui.w.after(box);
 const s=st[t.id];if(s&&s.done)finish(t,s.pts,s.stars,true);else if(s&&s.tries)t._ui.tries.textContent='المحاولة '+(s.tries+1)+' من '+TRIES;}
function upd(){let sc=0,stn=0,dn=0;ALLQ.forEach(q=>{const s=st[q.id];if(s&&s.done){sc+=Math.min(q.pts,s.pts+(s.rec||0));stn+=s.stars||0;dn++;}});
 TW.forEach(t=>{const s=st[t.id];if(s&&s.done)stn+=s.stars||0;});const twp=TW.filter(t=>!(st[t.id]&&st[t.id].done)).length;
 $('#score').textContent=String(Math.round(sc*100)/100).replace('.',',')+' / '+TOTAL;$('#stars').textContent='⭐ '+stn;$('#prog').style.width=(100*dn/ALLQ.length)+'%';
 if(dn===ALLQ.length&&!twp){$('#certlock').style.display='none';$('#certbox').style.display='block';}else if(dn===ALLQ.length){$('#certlock').textContent='بقي '+twp+' مثال(أمثلة) مماثلة: أكملها لتُفتح الشهادة.';}
 return sc;}
function drawCert(){const nm=$('#nm').value.trim();if(!nm){$('#nm').focus();$('#nm').classList.add('shake');return;}
 const sc=upd(),cv=$('#cv'),x=cv.getContext('2d'),W=1000,H=680;cv.style.display='block';$('#dl').style.display='inline-block';
 const g=sc>=17?['#b8860b','#fff7d6','شهادة تميّز ذهبية']:sc>=12?['#7d8a99','#f1f4f8','شهادة إتقان فضية']:['#0b4f8a','#eef5fc','شهادة مشاركة'];
 x.fillStyle=g[1];x.fillRect(0,0,W,H);x.strokeStyle=g[0];x.lineWidth=14;x.strokeRect(16,16,W-32,H-32);x.lineWidth=2;x.strokeRect(36,36,W-72,H-72);
 x.direction='rtl';x.textAlign='center';x.fillStyle='#1d2433';
 x.font='22px Tahoma,Arial';x.fillText('متوسطة العربي بن مهيدي، وادي فراغة، قالمة',W/2,90);
 x.font='bold 46px Tahoma,Arial';x.fillStyle=g[0];x.fillText(g[2],W/2,170);
 x.fillStyle='#1d2433';x.font='26px Tahoma,Arial';x.fillText('تُمنح للتلميذ(ة)',W/2,240);
 x.font='bold 42px Tahoma,Arial';x.fillText(nm,W/2,305);
 x.font='26px Tahoma,Arial';x.fillText('لإتقانه(ا) درس «أُتقِن»:',W/2,370);
 x.font='bold 30px Tahoma,Arial';x.fillStyle='#0b4f8a';x.fillText(L.certName,W/2,420);
 x.fillStyle='#1d2433';x.font='bold 34px Tahoma,Arial';x.fillText('العلامة: '+String(Math.round(sc*100)/100).replace('.',',')+' / 20',W/2,495);
 const d=new Date();x.font='22px Tahoma,Arial';x.fillText('التاريخ: '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear(),W/2,560);
 x.fillText('الأستاذ: يوسفي السوفي',W/2,605);fly($('#mk'),14,['⭐','🌟','✨','🏅']);beep(true);}
if(typeof TWINS!=='undefined'){L.sections.forEach(s=>(s.qs||[]).forEach(q=>{if(TWINS[q.id]&&!q.twin)q.twin=TWINS[q.id];}));}
/* LTR math in plain Arabic text: wrap runs that contain an operator or a root sign */
const MATH_RUN=/[A-Za-z0-9√(\[][A-Za-z0-9√×÷+\-−=<>≤≥≠,.()\[\]'’\/²³° ]*[A-Za-z0-9)\]'’²³°]|√[A-Za-z0-9]*/g;
function bidiFix(root){if(!root||root.nodeType!==1)return;if(root.closest('.m,.mb,.key,svg,script,style,textarea,input'))return;
 const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.m,.mb,.key,svg,script,style,textarea')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
 const list=[];let t;while(t=tw.nextNode())if(/[√×÷=+−<>≤≥≠]/.test(t.data))list.push(t);
 list.forEach(t=>{const s=t.data;let last=0,out=document.createDocumentFragment(),m,hit=false;MATH_RUN.lastIndex=0;
  while(m=MATH_RUN.exec(s)){if(!/[√×÷=+−<>≤≥≠]/.test(m[0]))continue;hit=true;out.appendChild(document.createTextNode(s.slice(last,m.index)));const sp=document.createElement('span');sp.className='m mt';sp.textContent=m[0];out.appendChild(sp);last=m.index+m[0].length;}
  if(!hit)return;out.appendChild(document.createTextNode(s.slice(last)));t.parentNode.replaceChild(out,t);});}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>bidiFix(n.nodeType===3?n.parentElement:n)))).observe(document.body,{childList:true,subtree:true});
render();bidiFix(document.body);
})();
</script>
