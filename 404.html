<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رياضيات المتوسط</title>
<script>
/* A lost or old address (for example after the phone closed the app): go back to the site's index instead of a 404. */
(function () {
  var seg = location.pathname.split("/")[1] || "";
  var base = location.hostname.indexOf("github.io") > 0 && seg ? "/" + seg + "/" : "/";
  location.replace(base + (location.hash || ""));
})();
</script>
</head>
<body style="font-family:Tahoma,sans-serif;text-align:center;padding:40px">جارٍ فتح الفهرس… <a href="./">اضغط هنا إن لم يُفتح</a></body>
</html>
